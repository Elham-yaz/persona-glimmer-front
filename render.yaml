# Render Blueprint Configuration
# This file can be used to deploy services via Render Blueprint
# Or use the manual steps in RENDER_DEPLOYMENT_GUIDE.md

services:
  - type: web
    name: persona-glimmer-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ASSIGNMENT_MODE
        value: random            # random | balanced (docs/STUDY2_API.md §0)
      - key: ALLOW_FORCED_ASSIGNMENT
        value: "false"           # never true in production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Set these as secrets in the Render dashboard after creating the service:
      # DATABASE_URL   - Render PostgreSQL connection string (Internal URL, ?sslmode=require)
      # OPENAI_API_KEY - OpenAI API key
      # ADMIN_API_KEY  - strong random string; the admin API is disabled if unset
      # FRONTEND_URL   - the Netlify site URL, no trailing slash (exact-match CORS)
      # Optional: DATABASE_CA_CERT / DATABASE_SSL_NO_VERIFY (TLS escape hatches)
      # Note: JWT_SECRET is no longer used (Study 2 has no user accounts).
